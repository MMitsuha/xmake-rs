name: Cross Compilation

on:
  workflow_dispatch: 
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  cross-compile:
    name: Cross Compilation x86 on x64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v3

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # Pin to the release the vendored modules were synced against.
          # branch@dev builds xmake from source, which fails on the
          # windows-2025-vs2026 image (pdcurses slk.c warning treated as error).
          xmake-version: '3.1.2'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cross-compile static test
        run: cargo build -p static --target ${{ matrix.target }}